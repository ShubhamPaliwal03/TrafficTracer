<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Botnet Detector</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Botnet Detection Tool</h1>
        <form id="uploadForm">
            <label>Select Network Type:</label>
            <select id="networkType" name="networkType">
                <option value="home">Home</option>
                <option value="soho">Small Office/Home Office (SOHO)</option>
                <option value="enterprise">Enterprise</option>
            </select>

            <label>Upload CSV File:</label>
            <input type="file" name="file" accept=".csv" required>

            <button type="submit">Detect</button>
        </form>

        <div id="loader" class="loader" style="display:none;"></div>

        <div id="result" class="result" style="display:none;">
            <h2>Detection Result</h2>
            <p><strong>Threshold:</strong> <span id="threshold"></span>%</p>
            <p><strong>Botnet Flow Ratio:</strong> <span id="botnetRatio"></span>%</p>
            <p id="verdict" class="verdict"></p>
            <canvas id="barChart"></canvas>
            <canvas id="doughnutChart"></canvas>
        </div>

        <div class="actions">
            <a href="/guide.html" class="btn">Read Instructions</a>
            <a href="http://localhost:5000/download-cicflowmeter" class="btn" onclick="setTimeout(() => { window.location.href='/guide.html' }, 1000)">Download CICFlowMeter</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrafficTracer | Botnet Detection Tool</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="shortcut icon" href="./resources/logo_light.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: center; align-items: center;">
            <h1>TrafficTracer</h1>
            <img src="./resources/logo_light.png" alt="traffictracer_logo" style="height: 60px; margin-left: 15px;">
        </div>
        <h5 style="display: flex; justify-content: center; align-items: center;">Botnet Detection Tool</h5>
        <form id="uploadForm">
            <label>Select Network Type:</label>
            <select id="networkType" name="networkType">
                <option value="home">Home</option>
                <option value="soho">Small Office/Home Office (SOHO)</option>
                <option value="enterprise">Enterprise</option>
            </select>

            <label>Upload CSV File:</label>
            <input type="file" name="file" accept=".csv" required>

            <button type="submit">Detect</button>
        </form>

        <div id="loader" class="loader" style="display:none;"></div>

        <div id="result" class="result" style="display:none;">
            <h2>Detection Result</h2>
            <p><strong>Threshold:</strong> <span id="threshold"></span>%</p>
            <p><strong>Botnet Flow Ratio:</strong> <span id="botnetRatio"></span>%</p>
            <p id="verdict" class="verdict"></p>
            <div id="chart-container">
                <canvas id="barChart"></canvas>
                <canvas id="doughnutChart"></canvas>
            </div>
        </div>

        <div class="actions">
            <a href="./guide.html" class="btn">Read Instructions</a>
            <a href="https://traffictracer.onrender.com/download-cicflowmeter" class="btn" onclick="setTimeout(() => { window.location.href='./guide.html' }, 1000)">Download CICFlowMeter</a>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
